name: Agent CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and test dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv pip install --system "langgraph>=1.2.0" "langchain-core>=1.7.0" pydantic pytest pytest-asyncio
      - name: Run Pytest
        run: pytest -v tests/test_agent_workflow.py
